---
apiVersion: v1
kind: Service
metadata:
  name: lfx-v2-query-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}

spec:
  ports:
    - name: web
      port: {{ .Values.service.port }}
      targetPort: web

  selector:
    app: lfx-v2-query-service
