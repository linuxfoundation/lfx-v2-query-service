                    type: integer
                    description: Maximum possible undercount per returned group within the walked authorized set; zero means exact
                    example: 0
                    format: int64
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/CountGroup'
                    description: Per-group counts when group_by is set, ordered by count descending then key ascending; omitted when no group matched
                    example:
                        - count: 30
                          key: a1b2c3d4
                        - count: 30
                          key: a1b2c3d4
                        - count: 30
                          key: a1b2c3d4
                groups_complete:
                    type: boolean
                    description: True when every group is present; false when more groups exist than group_by_size or when has_more is true
                    example: false
                has_more:
                    type: boolean
                    description: 'True if count is not guaranteed to be exhaustive: client should request a narrower query'
                    example: true
                metric_complete:
                    type: boolean
                    description: True when the metric was computed over every distinct value; false when it stopped at the cap or when has_more is true
                    example: true
                metric_value:
                    type: integer
                    description: Value of the requested metric
                    example: 17
                    format: int64
